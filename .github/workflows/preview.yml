# Share-able PREVIEW of the site on GitHub Pages, rebuilt on every push to
# main. This is not the hosting decision (CLAUDE.md: hosting comes last, the
# build stays host-agnostic): it only sets the preview's address, and
# `npm run build` stays unchanged everywhere else.
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Build for https://<user>.github.io/<repo>/ instead of the domain root.
      - run: npm run build
        env:
          PREVIEW_SITE_URL: ${{ steps.pages.outputs.origin }}
          PREVIEW_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
