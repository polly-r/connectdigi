         <text x="848" y="458" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2430" text-anchor="start" letter-spacing="0">Notify customer</text><text x="848" y="490" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7686" text-anchor="start" letter-spacing="0">SMS with live link</text>
