         <text x="518" y="458" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2430" text-anchor="start" letter-spacing="0">Assign vehicle</text><text x="518" y="490" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7686" text-anchor="start" letter-spacing="0">Nearest free driver</text>
         <path d="M770 440 H820" stroke="#1B2430" stroke-width="4"/><circle cx="795" cy="440" r="9" fill="#1B2430" /><g filter="url(#shadow)"><rect x="820" y="330" width="280" height="220" rx="18" fill="#FFFFFF" /></g>
