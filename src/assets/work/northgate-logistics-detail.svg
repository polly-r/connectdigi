         <rect x="188" y="360" width="52" height="52" rx="12" fill="#F26B1D" /><text x="214" y="395" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#FFF" text-anchor="middle" letter-spacing="0">1</text>
         <text x="188" y="458" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2430" text-anchor="start" letter-spacing="0">New order</text><text x="188" y="490" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#6B7686" text-anchor="start" letter-spacing="0">From the web shop</text>
