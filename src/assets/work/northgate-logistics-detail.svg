<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"><defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.14"/></filter></defs><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#E9EBEE" /><text x="160" y="170" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#1B2430" text-anchor="start" letter-spacing="0">Order-to-invoice automation</text>
   <text x="160" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" fill="#5E6978" text-anchor="start" letter-spacing="0">Each step runs on its own; people only step in for exceptions.</text>
